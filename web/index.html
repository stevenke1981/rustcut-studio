<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RustCut Studio</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">R</span>
      <div><strong>RustCut Studio</strong><small>Prompt-driven editor</small></div>
    </div>
    <select id="projectSelect" aria-label="選擇專案"></select>
    <button id="newProjectBtn">新增專案</button>
    <span id="status" class="status">就緒</span>
  </header>

  <main class="workspace">
    <aside class="panel assets-panel">
      <div class="panel-title"><h2>素材</h2><span id="assetCount">0</span></div>
      <form id="importForm" class="stack-form">
        <label>本機素材路徑<input id="mediaPath" placeholder="C:\\video\\interview.mp4" required /></label>
        <button type="submit">匯入素材</button>
      </form>
      <div id="assetList" class="asset-list empty-state">尚未匯入素材</div>
    </aside>

    <section class="editor-panel">
      <div class="viewer-wrap">
        <video id="viewer" controls playsinline></video>
        <div id="viewerEmpty" class="viewer-empty">選擇素材以預覽</div>
      </div>
      <div class="transport">
        <button id="undoBtn">復原</button>
        <button id="redoBtn">重做</button>
        <span id="projectMeta">—</span>
        <button id="renderBtn" class="primary">輸出 MP4</button>
      </div>
      <div class="timeline-header">
        <strong>時間軸</strong>
        <span>0s</span><span>25%</span><span>50%</span><span>75%</span><span>結尾</span>
      </div>
      <div id="timeline" class="timeline empty-state">時間軸尚無片段</div>
    </section>

    <aside class="panel chat-panel">
      <div class="panel-title"><h2>AI 剪輯助理</h2><select id="plannerSelect"><option value="rule">規則</option><option value="llm">LLM</option></select></div>
      <div id="chatLog" class="chat-log">
        <article class="message assistant">輸入：「移除靜音、刪除贅詞、加字幕，改成 9:16」。每次操作都會落在可復原的時間軸。</article>
      </div>
      <form id="chatForm" class="chat-form">
        <textarea id="promptInput" rows="4" placeholder="描述你想要的剪輯結果…" required></textarea>
        <div class="chat-actions">
          <button id="planOnlyBtn" type="button">只產生計畫</button>
          <button type="submit" class="primary">套用剪輯</button>
        </div>
      </form>
    </aside>
  </main>

  <dialog id="newProjectDialog">
    <form method="dialog" id="newProjectForm" class="dialog-form">
      <h3>新增影片專案</h3>
      <label>名稱<input id="newProjectName" value="我的 RustCut 專案" required /></label>
      <label>畫面比例<select id="newProjectPreset"><option value="1920x1080">16:9 橫式</option><option value="1080x1920">9:16 直式</option><option value="1080x1080">1:1 方形</option></select></label>
      <div><button value="cancel">取消</button><button id="createProjectBtn" value="default" class="primary">建立</button></div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
